; PlatformIO build for TamaPoke (upstream builds with arduino-cli, see README).
; Board: Waveshare ESP32-S3-Touch-AMOLED-1.75. Same settings as the arduino-cli
; FQBN: 16 MB flash, OPI PSRAM, app3M_fat9M_16MB, USB CDC on boot.
[platformio]
src_dir = .

[env:tamapoke]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = app3M_fat9M_16MB.csv
build_src_filter = +<*.ino> +<*.cpp> -<.pio/> -<test/> -<tools/> -<web/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; PlatformIO's .ino converter misses two prototypes that arduino-cli generates.
build_src_flags =
    -include "${PROJECT_DIR}/pio_protos.h"
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.8
    lewisxhe/SensorLib
    lewisxhe/XPowersLib
    olikraus/U8g2
monitor_speed = 115200
